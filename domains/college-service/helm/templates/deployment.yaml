apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "svc.name" .}}
spec:
  replicas: {{ .Values.replicaCount }}
  selector: {matchLabels: {app: {{ include "svc.name" .}}}}
  template:
    metadata: {labels: {app: {{ include "svc.name" .}}}}
    spec:
      serviceAccountName: emtaf-domain
      containers:
      - name: app
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.imagePullPolicy }}
        ports: [{containerPort: 3000}]
        envFrom: [{configMapRef: {name: {{ .Values.envFromConfig }}}}, {secretRef: {name: {{ .Values.envFromSecret }}}}]
        resources: {{- toYaml .Values.resources | nindent 10 }}
        startupProbe: {httpGet: {path: /health/live, port: 3000}, failureThreshold: 30, periodSeconds: 5}
        readinessProbe: {httpGet: {path: /health/ready, port: 3000}, periodSeconds: 10}
        livenessProbe: {httpGet: {path: /health/live, port: 3000}, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "svc.name" .}}
spec: {selector: {app: {{ include "svc.name" .}}}, ports: [{port: 80, targetPort: 3000}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: {{ include "svc.name" .}}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: {{ include "svc.name" .}}}
  minReplicas: 2
  maxReplicas: 10
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}]
