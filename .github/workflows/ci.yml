name: EMTAF Production CI
on:
  push:
    branches: [main, development]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  security-events: write
  id-token: write
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: {node-version: 22, cache: npm}
    - run: npm install --ignore-scripts
    - name: Dependency audit
      run: npm audit --audit-level=high
    - name: Build all workspaces
      run: npm run build
    - name: Security tests
      run: npm run test:security
    - name: Smoke/config tests
      run: npm run test:smoke && npm run test:production-config
    - name: Secret scan
      uses: gitleaks/gitleaks-action@v2
      env: {GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'}
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_USER: emtaf, POSTGRES_DB: emtaf_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U emtaf -d emtaf_test" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with: {node-version: 22}
    - run: npm install --ignore-scripts
    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client
    - name: Apply schema
      env: {DATABASE_URL: postgresql://emtaf:postgres@localhost:5432/emtaf_test}
      run: |
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/001-platform.sql
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/002-domains.sql
        for f in domains/*/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/005-production-hardening.sql
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/003-rls.sql
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/006-production-grade-events.sql
    - name: Integration tests
      env: {TEST_DATABASE_URL: postgresql://emtaf:postgres@localhost:5432/emtaf_test}
      run: npm run test:integration
  containers:
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        include:
        - name: tenant
          dockerfile: services/tenant-service/Dockerfile
        - name: hospital
          dockerfile: domains/hospital-service/Dockerfile
        - name: school
          dockerfile: domains/school-service/Dockerfile
        - name: college
          dockerfile: domains/college-service/Dockerfile
        - name: hotel
          dockerfile: domains/hotel-service/Dockerfile
        - name: realestate
          dockerfile: domains/realestate-service/Dockerfile
        - name: migrations
          dockerfile: infra/migrations/Dockerfile
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Build image
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        tags: emtaf/${{ matrix.name }}:${{ github.sha }}
        load: true
        provenance: true
        sbom: true
    - name: Trivy scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: emtaf/${{ matrix.name }}:${{ github.sha }}
        severity: 'CRITICAL,HIGH'
        exit-code: '1'
        ignore-unfixed: true
  backup-restore:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_PASSWORD: postgres, POSTGRES_USER: emtaf, POSTGRES_DB: emtaf_test}
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U emtaf -d emtaf_test" --health-interval 5s --health-timeout 5s --health-retries 30
    steps:
    - uses: actions/checkout@v4
    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client
    - name: Build schema and seed disposable data
      env: {DATABASE_URL: postgresql://emtaf:postgres@localhost:5432/emtaf_test}
      run: |
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/001-platform.sql
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/002-domains.sql
        for f in domains/*/migrations/*.sql; do psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"; done
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/005-production-hardening.sql
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/003-rls.sql
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f infra/postgres/006-production-grade-events.sql
        psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "insert into tenants(code,name) values('backup-itest','Backup Test') on conflict(code) do nothing;"
    - name: Backup
      env: {DATABASE_URL: postgresql://emtaf:postgres@localhost:5432/emtaf_test}
      run: |
        mkdir -p artifacts/backups
        pg_dump "$DATABASE_URL" --format=custom --no-owner --file artifacts/backups/emtaf-ci.dump
        sha256sum artifacts/backups/emtaf-ci.dump > artifacts/backups/emtaf-ci.dump.sha256
    - name: Restore to disposable database
      env:
        PGHOST: localhost
        PGUSER: emtaf
        PGPASSWORD: postgres
      run: |
        createdb emtaf_restore
        pg_restore --clean --if-exists --no-owner --dbname emtaf_restore artifacts/backups/emtaf-ci.dump
        psql emtaf_restore -v ON_ERROR_STOP=1 -c "select count(*) from tenants where code='backup-itest';"
    - uses: actions/upload-artifact@v4
      with: {name: emtaf-backup-verification, path: artifacts/backups}

  release-signing:
    if: startsWith(github.ref,'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [quality, integration, containers, backup-restore]
    permissions: {contents: read, id-token: write}
    strategy:
      matrix:
        include:
        - name: tenant
          dockerfile: services/tenant-service/Dockerfile
        - name: hospital
          dockerfile: domains/hospital-service/Dockerfile
        - name: school
          dockerfile: domains/school-service/Dockerfile
        - name: college
          dockerfile: domains/college-service/Dockerfile
        - name: hotel
          dockerfile: domains/hotel-service/Dockerfile
        - name: realestate
          dockerfile: domains/realestate-service/Dockerfile
        - name: migrations
          dockerfile: infra/migrations/Dockerfile
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-buildx-action@v3
    - name: Registry login
      uses: docker/login-action@v3
      with:
        registry: ${{ vars.EMTAF_REGISTRY }}
        username: ${{ secrets.EMTAF_REGISTRY_USER }}
        password: ${{ secrets.EMTAF_REGISTRY_PASSWORD }}
    - uses: sigstore/cosign-installer@v3.7.0
    - name: Build and push signed-release candidate
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ matrix.dockerfile }}
        push: true
        tags: ${{ vars.EMTAF_REGISTRY }}/emtaf-${{ matrix.name }}:${{ github.ref_name }}
        provenance: true
        sbom: true
    - name: Scan pushed image
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ vars.EMTAF_REGISTRY }}/emtaf-${{ matrix.name }}:${{ github.ref_name }}
        severity: 'CRITICAL,HIGH'
        exit-code: '1'
        ignore-unfixed: true
    - name: Sign immutable release image
      env:
        IMAGE: ${{ vars.EMTAF_REGISTRY }}/emtaf-${{ matrix.name }}:${{ github.ref_name }}
      run: cosign sign --yes "$IMAGE"
