# Requires External Secrets Operator and an AWS Secrets Manager secret named emtaf/prod/platform.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: emtaf-platform, namespace: emtaf}
spec:
 refreshInterval: 1h
 secretStoreRef: {name: aws-secretsmanager, kind: ClusterSecretStore}
 target: {name: emtaf-platform-secrets, creationPolicy: Owner}
 data:
 - {secretKey: DATABASE_URL, remoteRef: {key: emtaf/prod/platform, property: DATABASE_URL}}
 - {secretKey: JWT_SECRET, remoteRef: {key: emtaf/prod/platform, property: JWT_SECRET}}
