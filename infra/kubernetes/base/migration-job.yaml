apiVersion: batch/v1
kind: Job
metadata:
  name: emtaf-migrations
  namespace: emtaf
spec:
  backoffLimit: 4
  template:
    metadata:
      labels: {app.kubernetes.io/part-of: emtaf, app: emtaf-migrations}
    spec:
      restartPolicy: OnFailure
      containers:
      - name: migrate
        image: emtaf-migrations:dev
        imagePullPolicy: IfNotPresent
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef: {name: emtaf-platform-secrets, key: DATABASE_URL}
        command: ["/app/migrate.sh"]
