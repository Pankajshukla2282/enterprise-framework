apiVersion: v1
kind: ResourceQuota
metadata: {name: emtaf-quota, namespace: emtaf}
spec: {hard: {requests.cpu: "8", requests.memory: 8Gi, limits.cpu: "16", limits.memory: 16Gi, pods: "80"}}
---
apiVersion: v1
kind: LimitRange
metadata: {name: emtaf-limits, namespace: emtaf}
spec:
 limits:
 - type: Container
   default: {cpu: 500m, memory: 512Mi}
   defaultRequest: {cpu: 100m, memory: 128Mi}
