apiVersion: apps/v1
kind: Deployment
metadata: {name: otel-collector, namespace: emtaf}
spec:
 replicas: 1
 selector: {matchLabels: {app: otel-collector}}
 template:
  metadata: {labels: {app.kubernetes.io/part-of: emtaf, app: otel-collector}}
  spec:
   containers:
   - name: otel-collector
     image: otel/opentelemetry-collector-contrib:0.111.0
     args: ["--config=/etc/otel/otel-collector.yaml"]
     ports:
     - {name: otlp-http, containerPort: 4318}
     - {name: otlp-grpc, containerPort: 4317}
     volumeMounts:
     - {name: config, mountPath: /etc/otel}
     resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
     readinessProbe: {httpGet: {path: /, port: 13133}, initialDelaySeconds: 5, periodSeconds: 10}
   volumes:
   - name: config
     configMap: {name: otel-collector-config}
---
apiVersion: v1
kind: Service
metadata: {name: otel-collector, namespace: emtaf}
spec:
 selector: {app: otel-collector}
 ports:
 - {name: otlp-http, port: 4318, targetPort: 4318}
 - {name: otlp-grpc, port: 4317, targetPort: 4317}
