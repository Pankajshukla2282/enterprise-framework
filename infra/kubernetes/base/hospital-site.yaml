apiVersion: apps/v1
kind: Deployment
metadata:
  name: hospital-site
  labels: {app: hospital-site}
spec:
  replicas: 1
  selector:
    matchLabels: {app: hospital-site}
  template:
    metadata:
      labels: {app: hospital-site}
    spec:
      serviceAccountName: emtaf-domain
      containers:
      - name: hospital-site
        image: emtaf-hospital-site:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        env:
        - name: PORT
          value: "3001"
        - name: API_BASE
          value: "http://hospital-service"
        resources:
          requests: {cpu: 25m, memory: 32Mi}
          limits: {cpu: 200m, memory: 128Mi}
        readinessProbe:
          httpGet: {path: /, port: 3001}
          initialDelaySeconds: 2
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /, port: 3001}
          initialDelaySeconds: 10
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: hospital-site
spec:
  selector: {app: hospital-site}
  ports:
  - port: 80
    targetPort: 3001
