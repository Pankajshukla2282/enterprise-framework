apiVersion: apps/v1
kind: Deployment
metadata: {name: hotel-service, namespace: emtaf}
spec:
 replicas: 2
 selector: {matchLabels: {app: hotel-service}}
 template:
  metadata: {labels: {app.kubernetes.io/part-of: emtaf, app: hotel-service}}
  spec:
   serviceAccountName: emtaf-domain
   containers:
   - name: hotel-service
     image: ghcr.io/YOUR_ORG/emtaf-hotel-service:0.9.0
     envFrom: [{configMapRef: {name: emtaf-platform-config}}, {secretRef: {name: emtaf-platform-secrets}}]
     ports: [{containerPort: 3000}]
     resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 512Mi}}
     startupProbe: {httpGet: {path: /health/live, port: 3000}, failureThreshold: 30, periodSeconds: 5}
     readinessProbe: {httpGet: {path: /health/ready, port: 3000}, periodSeconds: 10}
     livenessProbe: {httpGet: {path: /health/live, port: 3000}, periodSeconds: 20}
---
apiVersion: v1
kind: Service
metadata: {name: hotel-service, namespace: emtaf}
spec: {selector: {app: hotel-service}, ports: [{name: http, port: 80, targetPort: 3000}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: hotel-service, namespace: emtaf}
spec:
 scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: hotel-service}
 minReplicas: 2
 maxReplicas: 10
 behavior: {scaleUp: {stabilizationWindowSeconds: 30}, scaleDown: {stabilizationWindowSeconds: 300}}
 metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}}, {type: Resource, resource: {name: memory, target: {type: Utilization, averageUtilization: 75}}}]
