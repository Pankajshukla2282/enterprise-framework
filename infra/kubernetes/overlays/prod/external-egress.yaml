apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-managed-platform-egress
  namespace: emtaf
spec:
  podSelector: {matchLabels: {app.kubernetes.io/part-of: emtaf}}
  policyTypes: [Egress]
  egress:
  - to:
    - ipBlock: {cidr: REPLACE_WITH_MANAGED_PLATFORM_CIDR}
    ports:
    - {protocol: TCP, port: 5432}
    - {protocol: TCP, port: 6379}
    - {protocol: TCP, port: 9092}
