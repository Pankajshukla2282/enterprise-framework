# Template for External Secrets Operator. Replace spec.provider-specific fields for AWS Secrets Manager, Azure Key Vault, GCP Secret Manager or Vault.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata: {name: emtaf-platform-secrets, namespace: emtaf}
spec:
  refreshInterval: 1h
  secretStoreRef: {name: emtaf-secret-store, kind: ClusterSecretStore}
  target: {name: emtaf-platform-secrets, creationPolicy: Owner}
  data:
  - secretKey: DATABASE_URL
    remoteRef: {key: emtaf/production/database-url}
  - secretKey: JWT_SECRET
    remoteRef: {key: emtaf/production/jwt-secret}
