apiVersion: v1
kind: ConfigMap
metadata: {name: otel-collector-config, namespace: emtaf}
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          grpc: {endpoint: 0.0.0.0:4317}
          http: {endpoint: 0.0.0.0:4318}
    processors: {batch: {}}
    exporters:
      debug: {}
    service:
      pipelines:
        traces: {receivers: [otlp], processors: [batch], exporters: [debug]}
        metrics: {receivers: [otlp], processors: [batch], exporters: [debug]}
