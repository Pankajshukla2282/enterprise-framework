<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>EMTAF SaaS — Multi-Tenant Demo</title>
  <meta name="description" content="EMTAF multi-tenant SaaS platform wireframe demo for Hospital, School, College, Hotel and Real Estate domains.">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar">
      <div class="brand"><div class="brand-mark">E</div><div><strong>EMTAF</strong><span>Multi-Tenant SaaS</span></div></div>
      <div class="tenant-card">
        <label for="tenantSelect">Tenant</label>
        <select id="tenantSelect"></select>
        <div class="tenant-meta"><span id="tenantDomain">Hospital</span><span class="status-dot">Live demo</span></div>
      </div>
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-foot"><span class="mini-avatar">PS</span><div><strong>Platform Super Admin</strong><small id="roleLabel">superadmin</small></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button id="menuButton" class="icon-btn" aria-label="Toggle navigation">☰</button>
        <div class="breadcrumbs"><span>EMTAF</span><b>/</b><strong id="pageTitle">Dashboard</strong></div>
        <div class="top-actions"><button class="icon-btn">⌕</button><button class="icon-btn">◔</button><div class="user-chip"><span class="avatar">PS</span><span>Super Admin</span></div></div>
      </header>
      <section class="content">
        <div id="view"></div>
      </section>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="./app.js" defer></script>
</body>
</html>
